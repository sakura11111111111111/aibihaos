<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级笔记应用</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 侧边栏 -->
    <nav class="sidebar">
        <ul class="nav-icons">
            <li><a href="#" class="active tooltip" id="home-btn" data-tooltip="笔记列表"><i class="fas fa-list"></i></a></li>
            <li><a href="#" class="tooltip" id="create-note-btn" data-tooltip="创建新笔记"><i class="fas fa-plus-square"></i></a></li>
            <li><a href="#" class="tooltip" data-tooltip="待办事项"><i class="fas fa-check-square"></i></a></li>
            <li><a href="#" id="all-notes-btn" class="tooltip" data-tooltip="所有笔记"><i class="fas fa-file-alt"></i></a></li>
            <li><a href="#" class="tooltip" data-tooltip="历史记录"><i class="fas fa-history"></i></a></li>
            <li><a href="#" class="tooltip" data-tooltip="搜索笔记"><i class="fas fa-search"></i></a></li>
        </ul>
        <div class="user-icon">
            <a href="#" class="tooltip" data-tooltip="个人中心"><i class="fas fa-user-circle"></i></a>
        </div>
    </nav>

    <!-- 动态内容的容器 -->
    <main class="content-container" id="app-container"></main>

    <!-- JS 库和我们自己的脚本 -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    
    <script src="script.js"></script>

</body>
</html>
