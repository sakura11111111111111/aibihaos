<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级笔记应用</title>
</head>
<body>

    <!-- 侧边栏 -->
    <nav class="sidebar">
        <ul class="nav-icons">
            <li><a href="#" class="active tooltip" id="home-btn" data-tooltip="笔记列表"><i class="fas fa-list"></i></a></li>
            <li><a href="#" class="tooltip" id="create-note-btn" data-tooltip="创建新笔记"><i class="fas fa-plus-square"></i></a></li>
            <li><a href="#" class="tooltip" data-tooltip="待办事项"><i class="fas fa-check-square"></i></a></li>
            <li><a href="#" id="all-notes-btn" class="tooltip" data-tooltip="所有笔记"><i class="fas fa-file-alt"></i></a></li>
            <li><a href="#" class="tooltip" data-tooltip="历史记录"><i class="fas fa-history"></i></a></li>
            <li><a href="#" class="tooltip" data-tooltip="搜索笔记"><i class="fas fa-search"></i></a></li>
            <li><a href="#" id="settings-btn" class="tooltip" data-tooltip="设置与备份"><i class="fas fa-cog"></i></a></li>
        </ul>
        <div class="user-icon">
            <a href="#" class="tooltip" data-tooltip="个人中心"><i class="fas fa-user-circle"></i></a>
        </div>
    </nav>

    <!-- 动态内容的容器 -->
    <main class="content-container" id="app-container"></main>

    <!-- JS 入口 -->
    <script type="module" src="/src/main.js"></script>

</body>
</html>
