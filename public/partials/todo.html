<div class="main-workspace todo-container">
    <!-- 左侧：待办任务列表 -->
    <div id="todo-list-panel" class="panel">
        <div class="panel-header calendar-header">
            <h2 id="toggle-calendar-btn" class="calendar-toggle-btn">
                <i class="fas fa-calendar-alt"></i> 复习日历 
                <i class="fas fa-chevron-down toggle-icon"></i>
            </h2>
        </div>
        
        <!-- 日历组件容器 (默认隐藏) -->
        <div id="todo-calendar-wrapper" class="calendar-wrapper collapsed">
            <div id="todo-calendar-container"></div>
        </div>
        
        <div class="panel-header" style="margin-top: 10px; padding-top: 15px; border-top: 1px solid #f0f0f0;">
            <h3 id="todo-date-title" style="font-size: 16px; margin: 0; color: #606266;">今日任务</h3>
            <span id="todo-count" class="badge">0</span>
        </div>

        <div class="panel-content" style="padding-top: 10px;">
            <ul id="todo-list" class="todo-list">
                <!-- 任务项将通过 JS 动态生成 -->
                <li class="placeholder-text">正在检查您的复习计划...</li>
            </ul>
        </div>
    </div>

    <!-- 右侧：笔记预览与操作 -->
    <div id="todo-preview-panel" class="panel">
        <div class="panel-header">
            <h2 id="review-note-title">请选择一个任务开始复习</h2>
        </div>
        <div id="review-note-content" class="panel-content ql-editor">
            <div class="empty-state">
                <i class="fas fa-book-reader"></i>
                <p>点击左侧任务，开始沉浸式复习</p>
            </div>
        </div>
        
        <!-- 底部操作栏 -->
        <div class="panel-footer review-actions" style="display: none;">
            <div class="review-status-bar">
                <div class="review-info">
                    <span>当前阶段: <b id="current-stage">1</b></span>
                    <i class="fas fa-arrow-right"></i>
                    <span>下一次: <b id="next-interval">2天后</b></span>
                </div>
            </div>
            
            <div class="review-btn-group">
                <button id="review-forget-btn" class="review-btn btn-forget" data-tooltip="重置进度，明天复习">
                    <i class="fas fa-times"></i> 忘记
                </button>
                <button id="review-blur-btn" class="review-btn btn-blur" data-tooltip="保持进度，明天复习">
                    <i class="fas fa-question"></i> 模糊
                </button>
                <button id="review-remember-btn" class="review-btn btn-remember" data-tooltip="进入下一阶段">
                    <i class="fas fa-check"></i> 记住
                </button>
            </div>
        </div>
    </div>
</div>
