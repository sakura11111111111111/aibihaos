version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=advanced_notes_db
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=advanced_notes_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data: